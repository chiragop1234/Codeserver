version: 2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.7
      - run:
          name: "Build Docker image"
          command: "docker build -t myimage ."
      - run:
          name: "Run container"
          command: "docker run -d --name mycontainer myimage"
      - run:
          name: "Wait for tunnel"
          command: "sleep 20"
      - run:
          name: "Show logs"
          command: "docker logs mycontainer"
      - run:
          name: "Show tunnel URL"
          command: |
            TUNNEL_URL=$(docker logs mycontainer | grep 'Visit it at' | awk '{print $NF}')
            echo "Tunnel URL: $TUNNEL_URL"
workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test
