version: 2.1
jobs:
  build-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: "Build Docker image"
          command: "docker build -t myimage ."
      - run:
          name: "Run container in detached mode"
          command: "docker run -d --name mycontainer myimage"
      - run:
          name: "Wait for services to initialize"
          command: "sleep 60"
      - run:
          name: "Display container logs"
          command: "docker logs mycontainer"
workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test
