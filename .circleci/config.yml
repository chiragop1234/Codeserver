version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: "Build Docker image"
          command: "docker build -t myimage ."
      - run:
          name: "Run container"
          command: "docker run -d --name mycontainer myimage"
      - run:
          name: "Wait for services to start"
          command: "sleep 15"
      - run:
          name: "Test code-server inside container"
          command: "docker exec mycontainer curl -f http://127.0.0.1:10000"

workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test
