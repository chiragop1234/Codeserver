version: 2.1

jobs:
  build-and-test:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker  # Removed version specification
      - run:
          name: "Build Docker image"
          command: "docker build -t myimage ."
      - run:
          name: "Run container"
          command: "docker run -d -p 10000:10000 --name mycontainer myimage"
      - run:
          name: "Wait for code-server"
          command: "sleep 10"
      - run:
          name: "Test code-server"
          command: "curl -f http://localhost:10000"

workflows:
  build-and-test-workflow:
    jobs:
      - build-and-test
